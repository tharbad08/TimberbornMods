name: Build EBR Support Test

on:
  push:
    branches:
      - test/extended-builder-reach-unfinished-support
    paths:
      - 'TestBuild/EBRSupportTest/**'
      - '.github/workflows/build-ebr-support-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build TestBuild/EBRSupportTest/EBRSupportTest.csproj -c Release

      - name: Package
        run: |
          rm -rf /tmp/EBRSupportTest
          mkdir -p /tmp/EBRSupportTest/EBRSupportTest/version-1.1
          cp TestBuild/EBRSupportTest/bin/Release/netstandard2.1/EBRSupportTest.dll /tmp/EBRSupportTest/EBRSupportTest/version-1.1/
          cat > /tmp/EBRSupportTest/EBRSupportTest/version-1.1/manifest.json <<'JSON'
          {
            "Name": "EBR Unfinished Support Test Fix",
            "Version": "0.1.0",
            "Id": "EBRSupportTest",
            "MinimumGameVersion": "1.1.1",
            "Description": "Temporary test fix for Extended Builder Reach constructing on unfinished supports.",
            "RequiredMods": [
              { "Id": "ExtendedBuilderReach" },
              { "Id": "Harmony" }
            ]
          }
          JSON
          cd /tmp/EBRSupportTest
          zip -r EBRSupportTest.zip EBRSupportTest

      - name: Upload test zip
        uses: actions/upload-artifact@v4
        with:
          name: EBRSupportTest
          path: /tmp/EBRSupportTest/EBRSupportTest.zip
          if-no-files-found: error
