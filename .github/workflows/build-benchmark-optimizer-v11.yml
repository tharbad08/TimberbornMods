name: Build TB Optimizer

on:
  push:
    branches:
      - TB-Optimizer
      - chatgpt/tb-optimizer-swc-compat
    paths:
      - 'BenchmarkAndOptimizerV11Port/**'
      - '.github/workflows/build-benchmark-optimizer-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build BenchmarkAndOptimizerV11Port/BenchmarkAndOptimizerV11Port.csproj -c Release
      - name: Stage Timberborn mod (no nested ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="${RUNNER_TEMP}/timberborn-artifact/TBOptimizer"
          mkdir -p "$ROOT/version-1.1/Scripts"
          cp BenchmarkAndOptimizerV11Port/manifest.json "$ROOT/version-1.1/manifest.json"
          cp BenchmarkAndOptimizerV11Port/bin/Release/netstandard2.1/TBOptimizer.dll "$ROOT/version-1.1/Scripts/"
          test -s "$ROOT/version-1.1/Scripts/TBOptimizer.dll"
      - name: Upload single ready-to-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TBOptimizer_1.1.105
          path: ${{ runner.temp }}/timberborn-artifact/
          if-no-files-found: error
