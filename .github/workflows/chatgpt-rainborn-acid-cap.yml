name: Temporary Rainborn Acid Cap Build

on:
  push:
    branches:
      - chatgpt-temp-build-rainborn-acid-cap-20260927
    paths:
      - '.chatgpt-build/rainborn-acid-cap/**'
      - '.github/workflows/chatgpt-rainborn-acid-cap.yml'

  pull_request:
    branches:
      - master
    paths:
      - '.chatgpt-build/rainborn-acid-cap/**'
      - '.github/workflows/chatgpt-rainborn-acid-cap.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .chatgpt-build/rainborn-acid-cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build RainbornAcidChanceCap/RainbornAcidChanceCap.csproj -c Release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/Scripts
          cp RainbornAcidChanceCap/bin/Release/netstandard2.1/RainbornAcidChanceCap.dll package/Scripts/
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("package")
          out=Path("RainbornAcidChanceCap_0.1.2.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, Path("RainbornAcidChanceCap")/p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RainbornAcidChanceCap_0.1.2
          path: .chatgpt-build/rainborn-acid-cap/RainbornAcidChanceCap_0.1.2.zip
