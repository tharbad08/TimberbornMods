name: Build Levee Blueprint Source Tracer

on:
  push:
    branches:
      - diag/levee-blueprint-source
    paths:
      - 'TestBuild/LeveeBlueprintSourceTracer/**'
      - '.github/workflows/build-levee-blueprint-source-tracer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build TestBuild/LeveeBlueprintSourceTracer/LeveeBlueprintSourceTracer.csproj -c Release
      - name: Package
        run: |
          rm -rf /tmp/LeveeBlueprintSourceTracer
          mkdir -p /tmp/LeveeBlueprintSourceTracer/LeveeBlueprintSourceTracer/version-1.1
          cp TestBuild/LeveeBlueprintSourceTracer/bin/Release/netstandard2.1/LeveeBlueprintSourceTracer.dll /tmp/LeveeBlueprintSourceTracer/LeveeBlueprintSourceTracer/version-1.1/
          cat > /tmp/LeveeBlueprintSourceTracer/LeveeBlueprintSourceTracer/version-1.1/manifest.json <<'JSON'
          {
            "Name": "Levee Blueprint Source Tracer",
            "Version": "0.2.0",
            "Id": "LeveeBlueprintSourceTracer",
            "MinimumGameVersion": "1.1.2.4",
            "Description": "Diagnostic-only mod that reports the Levee blueprint bundle before modifier providers run and again after final deserialization.",
            "RequiredMods": [
              { "Id": "Harmony" }
            ]
          }
          JSON
          cd /tmp/LeveeBlueprintSourceTracer
          zip -r LeveeBlueprintSourceTracer.zip LeveeBlueprintSourceTracer
      - uses: actions/upload-artifact@v4
        with:
          name: LeveeBlueprintSourceTracer
          path: /tmp/LeveeBlueprintSourceTracer/LeveeBlueprintSourceTracer.zip
          if-no-files-found: error
