name: Build EBR Construction Diagnostic

on:
  push:
    branches:
      - diag/ebr-construction-source
    paths:
      - 'TestBuild/EBRConstructionDiagnostic/**'
      - '.github/workflows/build-ebr-construction-diagnostic.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build TestBuild/EBRConstructionDiagnostic/EBRConstructionDiagnostic.csproj -c Release
      - name: Package
        run: |
          rm -rf /tmp/EBRConstructionDiagnostic
          mkdir -p /tmp/EBRConstructionDiagnostic/EBRConstructionDiagnostic/version-1.1
          cp TestBuild/EBRConstructionDiagnostic/bin/Release/netstandard2.1/EBRConstructionDiagnostic.dll /tmp/EBRConstructionDiagnostic/EBRConstructionDiagnostic/version-1.1/
          cat > /tmp/EBRConstructionDiagnostic/EBRConstructionDiagnostic/version-1.1/manifest.json <<'JSON'
          {
            "Name": "EBR Construction Diagnostic",
            "Version": "0.1.0",
            "Id": "EBRConstructionDiagnostic",
            "MinimumGameVersion": "1.1.1",
            "Description": "Diagnostic-only mod for construction progressing on unfinished supports. Changes no gameplay behavior.",
            "RequiredMods": [
              { "Id": "ExtendedBuilderReach" },
              { "Id": "Harmony" }
            ]
          }
          JSON
          cd /tmp/EBRConstructionDiagnostic
          zip -r EBRConstructionDiagnostic.zip EBRConstructionDiagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: EBRConstructionDiagnostic
          path: /tmp/EBRConstructionDiagnostic/EBRConstructionDiagnostic.zip
          if-no-files-found: error
