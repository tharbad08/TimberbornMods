name: Temporary Benchmark Optimizer v1.1.33 Build

on:
  push:
    branches:
      - chatgpt/benchmark-optimizer-v11

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/benchmark-optimizer-v11

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build BenchmarkAndOptimizerV11Port/BenchmarkAndOptimizerV11Port.csproj -c Release

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/BenchmarkAndOptimizerV11
          rm -rf "$ROOT"
          mkdir -p "$ROOT/version-1.1/Scripts"
          cp BenchmarkAndOptimizerV11Port/manifest.json "$ROOT/version-1.1/manifest.json"
          cp BenchmarkAndOptimizerV11Port/bin/Release/netstandard2.1/BenchmarkAndOptimizerV11.dll "$ROOT/version-1.1/Scripts/"
          cd /tmp
          rm -f BenchmarkAndOptimizerV11_1.1.33.zip
          zip -r BenchmarkAndOptimizerV11_1.1.33.zip BenchmarkAndOptimizerV11
          cp BenchmarkAndOptimizerV11_1.1.33.zip "$GITHUB_WORKSPACE/BenchmarkAndOptimizerV11Port/BenchmarkAndOptimizerV11_1.1.33.zip"

      - name: Commit built package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BenchmarkAndOptimizerV11Port/BenchmarkAndOptimizerV11_1.1.33.zip
          git commit -m "build: BenchmarkAndOptimizerV11 1.1.33 [skip ci]"
          git push origin HEAD:chatgpt/benchmark-optimizer-v11
