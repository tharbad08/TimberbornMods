name: Build Benchmark Optimizer

on:
  push:
    branches:
      - chatgpt/benchmark-optimizer-v11
    paths:
      - "BenchmarkAndOptimizerV11Port/**"
      - ".github/workflows/build-benchmark-optimizer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build BenchmarkAndOptimizerV11Port/BenchmarkAndOptimizerV11Port.csproj -c Release

      - name: Package Timberborn mod
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="artifact/BenchmarkAndOptimizerV11/version-1.1"
          mkdir -p "$ROOT/Scripts"
          cp BenchmarkAndOptimizerV11Port/manifest.json "$ROOT/manifest.json"
          cp BenchmarkAndOptimizerV11Port/bin/Release/netstandard2.1/BenchmarkAndOptimizerV11.dll "$ROOT/Scripts/"
          cp BenchmarkAndOptimizerV11Port/README.md "$ROOT/README.md"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: BenchmarkAndOptimizerV11-1.1.23
          path: artifact/BenchmarkAndOptimizerV11
          if-no-files-found: error
