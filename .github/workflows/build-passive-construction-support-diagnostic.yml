name: Build Construction Support Guard

on:
  push:
    branches:
      - diag/passive-construction-support
    paths:
      - 'TestBuild/ConstructionSupportPassiveDiagnostic/**'
      - '.github/workflows/build-passive-construction-support-diagnostic.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build TestBuild/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic.csproj -c Release
      - name: Package
        run: |
          rm -rf /tmp/ConstructionSupportGuard
          mkdir -p /tmp/ConstructionSupportGuard/ConstructionSupportGuard/version-1.1
          cp TestBuild/ConstructionSupportPassiveDiagnostic/bin/Release/netstandard2.1/ConstructionSupportGuard.dll /tmp/ConstructionSupportGuard/ConstructionSupportGuard/version-1.1/
          cat > /tmp/ConstructionSupportGuard/ConstructionSupportGuard/version-1.1/manifest.json <<'JSON'
          {
            "Name": "Construction Support Guard",
            "Version": "0.1.0",
            "Id": "ConstructionSupportGuard",
            "MinimumGameVersion": "1.1.1",
            "Description": "Prevents construction from progressing or finishing while directly supported only by unfinished stackable block objects. Material delivery remains enabled.",
            "RequiredMods": [
              { "Id": "Harmony" }
            ]
          }
          JSON
          cd /tmp/ConstructionSupportGuard
          zip -r ConstructionSupportGuard.zip ConstructionSupportGuard
      - uses: actions/upload-artifact@v4
        with:
          name: ConstructionSupportGuard
          path: /tmp/ConstructionSupportGuard/ConstructionSupportGuard.zip
          if-no-files-found: error
