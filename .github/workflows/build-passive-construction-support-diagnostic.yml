name: Build Passive Construction Support Diagnostic

on:
  push:
    branches:
      - diag/passive-construction-support
    paths:
      - 'TestBuild/ConstructionSupportPassiveDiagnostic/**'
      - '.github/workflows/build-passive-construction-support-diagnostic.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build TestBuild/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic.csproj -c Release
      - name: Package
        run: |
          rm -rf /tmp/ConstructionSupportPassiveDiagnostic
          mkdir -p /tmp/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic/version-1.1
          cp TestBuild/ConstructionSupportPassiveDiagnostic/bin/Release/netstandard2.1/ConstructionSupportPassiveDiagnostic.dll /tmp/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic/version-1.1/
          cat > /tmp/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic/version-1.1/manifest.json <<'JSON'
          {
            "Name": "Construction Support Passive Diagnostic",
            "Version": "0.7.0",
            "Id": "ConstructionSupportPassiveDiagnostic",
            "MinimumGameVersion": "1.1.1",
            "Description": "Event-driven diagnostic for construction progressing or finishing without valid support. Observes IncreaseBuildTime and MarkAsFinished without modifying construction behavior.",
            "RequiredMods": [
              { "Id": "Harmony" }
            ]
          }
          JSON
          cd /tmp/ConstructionSupportPassiveDiagnostic
          zip -r ConstructionSupportPassiveDiagnostic.zip ConstructionSupportPassiveDiagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: ConstructionSupportPassiveDiagnostic
          path: /tmp/ConstructionSupportPassiveDiagnostic/ConstructionSupportPassiveDiagnostic.zip
          if-no-files-found: error
